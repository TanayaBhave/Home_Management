services:
  app:
    build: .
    # Host port comes from APP_PORT in .env (no default — set it before first
    # start). The container always listens on 8080 internally. Published on all
    # interfaces so tailscale serve (host-level) can reach it; use
    # "127.0.0.1:${APP_PORT}:8080" to hide it from the plain LAN.
    ports:
      - "${APP_PORT:?Set APP_PORT in .env}:8080"
    volumes:
      # SQLite database (home.sqlite + -wal/-shm) survives rebuilds/restarts.
      - ./data:/data
    env_file: .env # SYNC_TOKEN (required), VAPID_* (optional)
    environment:
      TZ: ${TZ:-UTC}
    restart: unless-stopped
